name: Release

# 发版流程。触发方式是推一个 v 开头的 tag：
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# 做三件事：
#   1. 构建 linux/amd64 与 linux/arm64 的多架构镜像并推到 GHCR；
#   2. 为三个平台构建独立二进制（含前端产物），打包成 tar.gz / zip；
#   3. 创建 GitHub Release 并附上这些产物。
#
# 前两件并行跑，Release 等二进制就绪后再创建 —— 否则会先出现一个
# 空 Release，用户点进去什么都没有。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（例如 v0.2.0）'
        required: true

permissions:
  contents: write # 创建 Release
  packages: write # 推 GHCR

env:
  REGISTRY: ghcr.io

jobs:
  # ── 容器镜像：多架构 ─────────────────────────────────────────
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR 要求镜像名**全小写**，而 GitHub 仓库名可以含大写字母
      # （本仓库就是 Telegram_session_Adblock）。
      # docker/metadata-action 不会自动转换，直接把 github.repository
      # 塞进去会在推送时失败，而且报错只提「invalid reference format」，
      # 不说是大小写的问题。
      #
      # bash 的 ${VAR,,} 是小写展开，在 ubuntu runner 的 bash 下可用。
      - name: 计算小写的镜像名
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 版本号注入二进制，启动日志与 /api/health 都会报告它
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 独立二进制：不依赖 Docker 的部署方式 ─────────────────────
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 二进制要自带前端产物 —— 否则用户拿到一个只会返回 JSON 的服务
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tgs/web-vue build

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/server-go/go.mod
          cache-dependency-path: packages/server-go/go.sum

      - name: 解析版本号
        id: ver
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: 交叉编译
        env:
          CGO_ENABLED: 0
          VERSION: ${{ steps.ver.outputs.version }}
        working-directory: packages/server-go
        run: |
          set -euo pipefail

          # 三个目标平台。
          # 全部用 CGO_ENABLED=0：现代 Go 的 SQLite 驱动是纯 Go 的，
          # 所以交叉编译不需要任何 C 工具链 —— 这是选 modernc.org/sqlite
          # 而不是 mattn/go-sqlite3 换来的直接好处。
          targets="linux/amd64 linux/arm64 windows/amd64"

          for target in $targets; do
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"

            out="tgs-${GOOS}-${GOARCH}"
            # 用显式 if 而不是 `[ ... ] && out=...`：
            # 后者在条件为假时整条语句返回 1，而它与 set -e 的交互
            # （「AND-OR 列表中非末尾命令的失败被忽略」）是个容易记错的细节。
            # 显式分支没有这层歧义。
            if [ "$GOOS" = "windows" ]; then
              out="${out}.exe"
            fi

            echo "── 构建 $target"
            go build -trimpath \
              -ldflags "-s -w -X github.com/tgs/server/internal/api.Version=${VERSION}" \
              -o "/tmp/dist/${out}" ./cmd/tgs
          done

      - name: 打包
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/pkg
          cd /tmp/dist

          for target in linux-amd64 linux-arm64; do
            dirname="tgs-${VERSION}-${target}"
            mkdir -p "/tmp/pkg/${dirname}"
            cp "tgs-${target}" "/tmp/pkg/${dirname}/tgs"
            cp -r "$GITHUB_WORKSPACE/packages/web-vue/dist" "/tmp/pkg/${dirname}/web-dist"
            cp "$GITHUB_WORKSPACE/.env.example" "/tmp/pkg/${dirname}/.env.example"
            tar -C /tmp/pkg -czf "/tmp/pkg/${dirname}.tar.gz" "${dirname}"
            rm -rf "/tmp/pkg/${dirname}"
          done

          # Windows 用 zip：tar.gz 在资源管理器里打不开，
          # 而拿独立二进制部署到 Windows 的人多半不会用命令行解压。
          dirname="tgs-${VERSION}-windows-amd64"
          mkdir -p "/tmp/pkg/${dirname}"
          cp "tgs-windows-amd64.exe" "/tmp/pkg/${dirname}/tgs.exe"
          cp -r "$GITHUB_WORKSPACE/packages/web-vue/dist" "/tmp/pkg/${dirname}/web-dist"
          cp "$GITHUB_WORKSPACE/.env.example" "/tmp/pkg/${dirname}/.env.example"
          (cd /tmp/pkg && zip -qr "${dirname}.zip" "${dirname}")
          rm -rf "/tmp/pkg/${dirname}"

          ls -lh /tmp/pkg

      - name: 生成校验和
        run: |
          cd /tmp/pkg
          # 校验和让用户能确认下载的产物没有被中途篡改
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: /tmp/pkg/*
          if-no-files-found: error

  # ── 发布 ────────────────────────────────────────────────────
  release:
    needs: [binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      # 把部署脚本也作为 Release 资产发布。
      #
      # 脚本里的 raw.githubusercontent 链接指向 master，会随仓库漂移；
      # 作为资产附在这里，用户就能拿到与**这个版本**配套的那一份。
      - name: 附上部署脚本
        run: cp scripts/deploy.sh dist/deploy.sh

      # 与镜像任务同样的原因：GHCR 的名字必须全小写
      - name: 计算小写的镜像名
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          body: |
            ## 一键部署

            在服务器上执行（需要 root）：

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deploy.sh | sudo bash
            ```

            脚本会自动判断是首次安装还是升级：

            - **首次**：生成 `MASTER_KEY` 与 `SESSION_SECRET`，询问管理员密码，
              拉取镜像并启动，最后打印反向代理该填什么。
            - **再次运行**：拉取新镜像并重启容器。**数据与密钥原样保留**，
              端口也保持不变。

            > `MASTER_KEY` 用来加密库里存的 bot token，脚本在任何情况下都不会覆盖它。
            > 升级前还会自动备份 `.env`。

            ## 容器镜像

            ```bash
            docker pull ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ```

            支持 `linux/amd64` 与 `linux/arm64`。镜像基于 `scratch` ——
            没有 shell、没有包管理器，全部内容只有一个静态链接的二进制、
            CA 证书与前端产物，约 20MB。

            ### 在 1Panel 上建站

            容器默认发布到 `127.0.0.1:8787`，
            1Panel 的反向代理直接填：

            ```
            代理地址  http://127.0.0.1:8787
            发送域名  $host
            ```

            这个上游地址可行是因为 1Panel 的 OpenResty 使用 `network_mode: host`，
            容器内的 `127.0.0.1` 就是宿主机的 loopback。
            脚本还会在检测到 `1panel-network` 时让容器加入它，
            因此按容器名配上游（`http://tgs-panel:8787`）同样可行。

            ## 独立二进制

            不想用 Docker 的话，下载对应平台的压缩包：

            ```bash
            cp .env.example .env
            # 按 .env 里的注释生成 MASTER_KEY 与 SESSION_SECRET
            ./tgs
            ```

            二进制静态链接（`CGO_ENABLED=0`），不依赖系统库，
            时区数据库也已编入 —— 可以直接扔进任何 Linux 发行版运行。

            ## 校验

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
