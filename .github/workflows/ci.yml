name: CI

# 每次推送与 PR 都跑一遍：类型检查、单元测试、镜像可构建性。
#
# 刻意把「镜像能不能构建」也放进 CI —— 镜像构建是最容易因为
# 依赖清单或路径改动而静默失效的一环，而它只在发版时才暴露的话，
# 发版当天才发现问题。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行自动取消：推一串提交时不该排队跑一串过时的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署脚本语法检查
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/test-deploy.sh
          bash -n scripts/test-migration-docker.sh
      - name: 部署、迁移与回滚回归测试
        run: bash scripts/test-deploy.sh scripts/deploy.sh

  # ── 前端：类型检查与构建 ────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm --filter @tgs/web-vue build

      # 说明：这里**没有**跑 vue-tsc。
      # 本仓库锁定的 TypeScript 7（新的 Go 版编译器）移除了
      # ./lib/tsc 导出，而 vue-tsc 3.x 依赖它 —— 目前没有兼容版本。
      # 因此 .vue 内部的类型检查暂时缺失，构建只能捕获模板语法、
      # 导入路径与表达式错误。等 vue-tsc 跟进后应当补上这一步。

  # ── 后端：静态检查与单元测试 ─────────────────────────────────
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 用 go.mod 里的版本约束，避免 CI 与本地各写一份版本号
          go-version-file: packages/server-go/go.mod
          cache-dependency-path: packages/server-go/go.sum

      - name: 确认代码已格式化
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w .："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test ./... -race -count=1

      - name: 构建（确认 CGO_ENABLED=0 可行）
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o /tmp/tgs ./cmd/tgs

  # ── 镜像：确认 Dockerfile 仍然能构建 ─────────────────────────
  #
  # 只构建不推送，也不做多架构 —— 多架构要跑 QEMU，慢得多，
  # 而「构建得出来吗」这个问题用单架构就能回答。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tgs:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证真实容器迁移、SQLite 数据保留与失败回滚
        run: sudo bash scripts/test-migration-docker.sh
